<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投递进度追踪 · 秋招/实习</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --border:#e4e7ec; --text:#1f2329; --text2:#6b7280;
  --primary:#3370ff; --primary-weak:#e8f0ff;
  --green:#34a853; --red:#e5484d; --orange:#f59e0b; --purple:#7c5cff; --teal:#0ea5a5;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:17px;font-weight:700;white-space:nowrap}
.logo span{color:var(--primary)}
.search{flex:1;min-width:180px;max-width:360px;position:relative}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;background:#f7f8fa;outline:none}
.search input:focus{border-color:var(--primary);background:#fff}
.search::before{content:"🔍";position:absolute;left:9px;top:7px;font-size:12px;opacity:.5}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{padding:7px 13px;border:none;background:transparent;border-radius:8px;color:var(--text2);font-size:13.5px;white-space:nowrap}
.tab:hover{background:#f0f2f5}
.tab.active{background:var(--primary-weak);color:var(--primary);font-weight:600}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:13.5px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#2a5fd9}
.btn-ghost{background:#f0f2f5;color:var(--text)}
.btn-ghost:hover{background:#e4e7ec}
.btn-danger-ghost{background:#fdecec;color:var(--red)}
.stat-chip{font-size:12px;color:var(--text2);white-space:nowrap}

/* ---------- 通用 ---------- */
.wrap{padding:16px 20px 60px;max-width:1400px;margin:0 auto}
.empty{padding:60px 0;text-align:center;color:var(--text2)}
.empty .big{font-size:40px;margin-bottom:10px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;white-space:nowrap}
.count{display:inline-block;min-width:18px;text-align:center;background:rgba(255,255,255,.55);border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}

/* ---------- 表格 ---------- */
.table-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:1350px}
th{position:sticky;top:0;background:#f7f8fa;text-align:left;padding:9px 10px;font-size:12.5px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#eef0f3}
td{padding:8px 10px;border-bottom:1px solid #f0f1f3;vertical-align:top;font-size:13px}
tr.data-row:hover{background:#f8f9fb}
tr.data-row{cursor:pointer}
.cell-company{font-weight:600}
.cell-sub{font-size:11.5px;color:var(--text2);margin-top:2px}
.td-link{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.td-note{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;white-space:nowrap}

/* ---------- 看板 ---------- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;align-items:flex-start}
.kcol{background:#eef0f4;border-radius:var(--radius);min-width:250px;width:250px;flex-shrink:0;max-height:calc(100vh - 160px);display:flex;flex-direction:column}
.kcol-head{padding:10px 12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,.05)}
.kcol-body{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcol.drag-over{outline:2px dashed var(--primary);outline-offset:-2px}
.kcard{background:var(--panel);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow);cursor:grab;border:1px solid transparent}
.kcard:hover{border-color:var(--border)}
.kcard.dragging{opacity:.4}
.kcard .kc-company{font-weight:600;font-size:13.5px;margin-bottom:3px}
.kcard .kc-role{font-size:12.5px;color:var(--text2);margin-bottom:7px}
.kcard .kc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.kcard .kc-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ---------- 甘特 ---------- */
.gantt-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
.gantt{min-width:900px}
.g-header{display:flex;border-bottom:1px solid var(--border)}
.g-labels{width:230px;flex-shrink:0;border-right:1px solid var(--border)}
.g-labels .g-title{padding:10px 12px;font-size:12.5px;color:var(--text2);font-weight:600;height:34px}
.g-label{padding:8px 12px;border-bottom:1px solid #f0f1f3;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:44px}
.g-label b{display:block}
.g-label small{color:var(--text2)}
.g-track-head{position:relative;height:34px;flex:1}
.g-month{position:absolute;top:0;height:100%;border-left:1px solid var(--border);font-size:11px;color:var(--text2);padding:9px 0 0 6px}
.g-rows{position:relative;flex:1}
.g-row{position:relative;height:44px;border-bottom:1px solid #f0f1f3}
.g-grid{position:absolute;top:0;bottom:0;border-left:1px solid #eef0f3}
.g-bar{position:absolute;top:11px;height:22px;border-radius:6px;font-size:11px;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:26px}
.g-bar:hover{filter:brightness(1.08)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.6;z-index:2}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.mask.show{display:flex}
.modal{background:var(--panel);border-radius:14px;width:640px;max-width:100%;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.modal h3{font-size:16px;margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--text2)}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:56px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.attach-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.attach-item{display:inline-flex;align-items:center;gap:5px;background:#f0f2f5;border-radius:6px;padding:4px 8px;font-size:12px}
.attach-item button{border:none;background:none;font-size:12px;color:var(--text2)}

/* ---------- 模块导航 ---------- */
.modnav{display:flex;gap:3px;background:#f0f2f5;padding:3px;border-radius:10px}
.mod{padding:6px 14px;border:none;background:transparent;border-radius:8px;font-size:13.5px;color:var(--text2);white-space:nowrap}
.mod:hover{color:var(--text)}
.mod.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}

/* ---------- 经历库 ---------- */
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.exp-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer}
.exp-card:hover{border-color:var(--primary)}
.exp-kind{font-size:11.5px;padding:2px 9px;border-radius:20px;background:#eef4ff;color:#3370ff;display:inline-block}
.exp-title{font-weight:600;margin:7px 0 2px;font-size:14px}
.exp-org{font-size:12.5px;color:var(--text2)}
.exp-bul{font-size:12.5px;color:#4b5563;margin-top:7px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.chip{font-size:11px;padding:2px 7px;border-radius:6px;background:#f0f2f5;color:var(--text2)}
.chip.hit{background:#e6f7ed;color:#1f8a4c;font-weight:600}

/* ---------- 简历工坊 ---------- */
.studio{display:flex;gap:16px;align-items:flex-start}
.studio-left{flex:1;min-width:0}
.studio-right{width:430px;flex-shrink:0;position:sticky;top:74px;max-height:calc(100vh - 96px);overflow-y:auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.panel+.panel{margin-top:12px}
.panel h4{font-size:13.5px;margin-bottom:10px}
.panel .hint{font-size:12px;color:var(--text2);line-height:1.6}
.sel-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pick{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.pick.on{border-color:var(--primary);background:#f7faff}
.pick .drag-h{cursor:grab;color:#b3bac4;font-size:15px;padding-top:2px;user-select:none}
.pick-body{flex:1;min-width:0}
.pick-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick-score{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pick-meta{font-size:12px;color:var(--text2);margin-top:2px}
.bul-edit{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;margin-top:4px;resize:vertical;line-height:1.6}
.resume-preview{background:#fff;border:1px solid var(--border);padding:24px 22px;font-size:12.5px;line-height:1.75}
.resume-preview h1{font-size:20px;margin-bottom:3px}
.resume-preview .rp-contact{font-size:12px;color:#444}
.resume-preview .rp-sec{margin-top:15px;font-weight:700;font-size:13px;border-bottom:1px solid #e4e7ec;padding-bottom:3px}
.resume-preview .rp-item{margin-top:9px}
.resume-preview .rp-line{display:flex;justify-content:space-between;gap:8px}
.resume-preview .rp-line b{font-weight:600}
.resume-preview ul{margin:4px 0 0 17px}
.resume-preview li{margin-bottom:3px}
.check-item{font-size:12.5px;padding:7px 10px;border-radius:7px;background:#fff8e6;color:#8a5a00;margin-bottom:6px;line-height:1.6}
.check-item.ok{background:#e9f8ef;color:#1f7a45}
.mini{font-size:12px;padding:5px 10px;border-radius:7px}

/* toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.show{opacity:.92}

@media (max-width:900px){
  .studio{flex-direction:column}
  .studio-right{width:100%;position:static;max-height:none}
}
@media (max-width:640px){
  .topbar{padding:8px 12px}
  .wrap{padding:10px 10px 60px}
  .fgrid{grid-template-columns:1fr}
  .search{display:none}
  .modnav{order:9;width:100%}
  .mod{flex:1;text-align:center}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">📮 求职助手 <span>· 秋招/实习</span></div>
  <div class="modnav" id="modnav">
    <button class="mod active" data-mod="apply">📮 投递追踪</button>
    <button class="mod" data-mod="bank">🗂 经历库</button>
    <button class="mod" data-mod="studio">🎯 简历工坊</button>
    <button class="mod" data-mod="tuner">✂️ JD 简历微调</button>
    <button class="mod" data-mod="tpl">📄 简历模板</button>
  </div>
  <div class="tabs apply-only" id="tabs">
    <button class="tab active" data-view="table">📋 总表</button>
    <button class="tab" data-view="kb-progress">按进度看板</button>
    <button class="tab" data-view="kb-type">按实习类型</button>
    <button class="tab" data-view="kb-industry">按行业看板</button>
    <button class="tab" data-view="kb-priority">优先级看板</button>
    <button class="tab" data-view="gantt">甘特时间线</button>
  </div>
  <div class="search"><input id="search" placeholder="搜索公司 / 岗位 / 备注…"></div>
  <button class="btn btn-ghost apply-only" id="btnExport" title="导出JSON备份">导出</button>
  <button class="btn btn-ghost apply-only" id="btnImport" title="导入JSON备份">导入</button>
  <button class="btn btn-ghost apply-only" id="btnCsv" title="导出CSV(可用WPS/Excel打开)">CSV</button>
  <button class="btn btn-primary apply-only" id="btnAdd">＋ 新增投递</button>
  <button class="btn btn-ghost bank-only" id="btnProfile" style="display:none">👤 个人档案</button>
  <button class="btn btn-ghost bank-only" id="btnArchive" style="display:none" title="复制个人档案纯文本，可直接粘贴给 AI">📋 复制档案</button>
  <button class="btn btn-ghost bank-only" id="btnLoadPack" style="display:none" title="一键载入示例经历包（14段，自动去重）">📥 载入我的经历包</button>
  <button class="btn btn-primary bank-only" id="btnAddExp" style="display:none">＋ 新增经历</button>
  <div class="stat-chip" id="statChip"></div>
  <input type="file" id="fileImport" accept=".json" hidden>
</div>

<div class="wrap" id="main"></div>

<!-- 编辑弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">新增投递</h3>
    <div class="fgrid">
      <div class="field"><label>公司名称 *</label><input id="f_company"></div>
      <div class="field"><label>行业</label>
        <select id="f_industry">
          <option value="">— 未选择 —</option>
          <option>券商</option><option>基金</option><option>银行</option><option>险资</option>
          <option>AMC</option><option>金融基础设施</option><option>其他金融</option>
          <option>互联网</option><option>实体国央企</option><option>外企</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>实习/招聘类型</label>
        <select id="f_type">
          <option value="">— 未选择 —</option>
          <option>暑期实习</option><option>日常实习</option><option>秋招</option><option>春招</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>投递岗位</label><input id="f_role"></div>
      <div class="field"><label>优先级</label>
        <select id="f_priority">
          <option>中</option><option>高</option><option>低</option>
        </select>
      </div>
      <div class="field"><label>当前进度</label>
        <select id="f_progress">
          <option>待投递</option><option>已投递</option><option>简历筛选</option><option>笔试</option>
          <option>面试中</option><option>Offer</option><option>结束/挂了</option>
        </select>
      </div>
      <div class="field"><label>最近任务（如：一面 10/12）</label><input id="f_next"></div>
      <div class="field"><label>JD发布日期</label><input type="date" id="f_jdDate"></div>
      <div class="field"><label>投递截止日期</label><input type="date" id="f_deadline"></div>
      <div class="field"><label>我的投递日期</label><input type="date" id="f_applyDate"></div>
      <div class="field"><label>招聘JD链接 🔗</label><input id="f_jdUrl" placeholder="https://…"></div>
      <div class="field"><label>投递官网/系统链接 🔗</label><input id="f_applyUrl" placeholder="https://…"></div>
      <div class="field"><label>公司官网 🔗</label><input id="f_companyUrl" placeholder="https://…"></div>
      <div class="field full"><label>岗位描述（JD摘录，面试前回顾）</label><textarea id="f_jd" rows="3"></textarea></div>
      <div class="field full"><label>历史进度（去年/前年时间线，可换行记录）</label><textarea id="f_history" rows="2" placeholder="例：2024秋招-投递9/20 → 笔试9/28 → 二面挂"></textarea></div>
      <div class="field full"><label>备注（面试表现 / HR反馈 / 待改进）</label><textarea id="f_note" rows="2"></textarea></div>
      <div class="field full"><label>投递简历（存到本机浏览器，可随时下载回顾）</label>
        <input type="file" id="f_resume" multiple>
        <div class="attach-list" id="attachList"></div>
        <div id="storageHint" style="font-size:11.5px;color:var(--text2);margin-top:4px"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger-ghost" id="btnDelete" style="margin-right:auto">删除</button>
      <button class="btn btn-ghost" id="btnCancel">取消</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<!-- 经历编辑弹窗 -->
<div class="mask" id="maskExp">
  <div class="modal">
    <h3 id="eTitle">新增经历</h3>
    <div class="fgrid">
      <div class="field"><label>经历类型</label>
        <select id="f_e_kind">
          <option>实习</option><option>项目</option><option>科研</option><option>课程</option>
          <option>竞赛</option><option>校园活动</option><option>技能/证书</option><option>其他</option>
        </select>
      </div>
      <div class="field"><label>重要程度（用于默认排序）</label>
        <select id="f_e_star"><option value="5">★★★★★ 核心亮点</option><option value="4">★★★★ 重要</option><option value="3" selected>★★★ 一般</option><option value="2">★★ 次要</option><option value="1">★ 备选</option></select>
      </div>
      <div class="field"><label>标题 *（如：某券商投行部实习 / XX 课程项目）</label><input id="f_e_title"></div>
      <div class="field"><label>公司 / 学校 / 组织</label><input id="f_e_org"></div>
      <div class="field"><label>角色 / 职位</label><input id="f_e_role"></div>
      <div class="field"><label>地点（可选）</label><input id="f_e_loc"></div>
      <div class="field"><label>开始时间</label><input type="month" id="f_e_start"></div>
      <div class="field"><label>结束时间（在职可留空）</label><input type="month" id="f_e_end"></div>
      <div class="field full"><label>经历描述（一行一条，投递时按岗位挑选）</label><textarea id="f_e_bullets" rows="5" placeholder="参与XX项目财务模型搭建，完成3家可比公司估值分析&#10;独立整理行业数据库，覆盖120+标的"></textarea></div>
      <div class="field full"><label>成果 / 量化（尽量写数字，简历里最加分）</label><textarea id="f_e_result" rows="2" placeholder="例：报告获部门负责人采纳；模型被用于实际立项决策"></textarea></div>
      <div class="field full"><label>关键词标签（逗号分隔，用于 JD 匹配打分）</label><input id="f_e_tags" placeholder="财务建模,估值,Excel,券商,投行,Wind"></div>
      <div class="field full"><label>补充备注（不写进简历，只给自己看）</label><textarea id="f_e_note" rows="2"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger-ghost" id="btnExpDelete" style="margin-right:auto">删除</button>
      <button class="btn btn-ghost" id="btnExpCancel">取消</button>
      <button class="btn btn-primary" id="btnExpSave">保存</button>
    </div>
  </div>
</div>

<!-- 个人档案弹窗 -->
<div class="mask" id="maskProfile">
  <div class="modal">
    <h3>👤 个人档案（通用信息，所有简历共用）</h3>
    <div class="fgrid">
      <div class="field"><label>姓名</label><input id="f_p_name"></div>
      <div class="field"><label>手机</label><input id="f_p_phone"></div>
      <div class="field"><label>邮箱</label><input id="f_p_email"></div>
      <div class="field"><label>现居城市</label><input id="f_p_city"></div>

<script>
/* ================= 数据层 ================= */
const LS_KEY = 'apply_tracker_v1';
const STAGES = ['待投递','已投递','简历筛选','笔试','面试中','Offer','结束/挂了'];
const TYPES  = ['暑期实习','日常实习','秋招','春招','其他'];
const INDUSTRIES = ['券商','基金','银行','险资','AMC','金融基础设施','其他金融','互联网','实体国央企','外企','其他'];
const PRIORITIES = ['高','中','低'];

const PROGRESS_COLOR = {
  '待投递':'#9aa3b2','已投递':'#3370ff','简历筛选':'#0ea5a5','笔试':'#f59e0b',
  '面试中':'#7c5cff','Offer':'#34a853','结束/挂了':'#e5484d'
};
const PRIORITY_COLOR = {'高':'#e5484d','中':'#f59e0b','低':'#9aa3b2'};

let records = [];

/* ---- 经历库 & 个人档案（通用底稿，跨岗位复用） ---- */
const LS_EXP = 'apply_tracker_exp_v1';
const LS_PROFILE = 'apply_tracker_profile_v1';

const EXP_KINDS = ['实习','项目','科研','课程','竞赛','校园活动','技能/证书','其他'];

  '竞赛':'#e5484d','校园活动':'#34a853','技能/证书':'#64748b','其他':'#9aa3b2'};

let experiences = [];
try { experiences = JSON.parse(localStorage.getItem(LS_EXP) || '[]'); } catch(e){ experiences = []; }
let profile = {};
try { profile = JSON.parse(localStorage.getItem(LS_PROFILE) || '{}'); } catch(e){ profile = {}; }
let S = { targetId:'', jd:'', picked:{}, order:[], summary:'', title:'' }; // 工坊状态
try { S = Object.assign(S, JSON.parse(localStorage.getItem(LS_STUDIO) || '{}')); } catch(e){}

function saveExp(){ localStorage.setItem(LS_EXP, JSON.stringify(experiences)); }
function saveProfile(){ localStorage.setItem(LS_PROFILE, JSON.stringify(profile)); }

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(records)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(d){ if(!d) return '—'; return d.slice(5).replace('-','/'); }
function daysLeft(d){ if(!d) return null; return Math.ceil((new Date(d) - new Date(new Date().toDateString()))/86400000); }

/* 简历附件：优先 IndexedDB（容量大），本地 file:// 打开受限时降级到 localStorage（小文件） */
let idb = null, fileMode = 'unknown'; // 'idb' | 'ls' | 'none'
function openIDB(){
  return new Promise(res=>{
    if(idb) return res(idb);
    if(fileMode==='ls') return res(null);
    try{
      if(!window.indexedDB) { return res(null); }
      const rq = indexedDB.open('apply_tracker_files', 1);
      rq.onupgradeneeded = e => e.target.result.createObjectStore('files');
      rq.onsuccess = e => { idb = e.target.result; fileMode='idb'; res(idb); };
      rq.onerror = () => { fileMode='ls'; res(null); };
      rq.onblocked = () => { fileMode='ls'; res(null); };
    }catch(_){ fileMode='ls'; res(null); }
  });
}
const LS_FILES='apply_tracker_files_ls';
function lsFiles(){ try{ return JSON.parse(localStorage.getItem(LS_FILES)||'{}'); }catch(e){ return {}; } }
function blobToDataURL(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(b); }); }
function dataURLToBlob(u){ const [h,b]=u.split(','); const mime=(h.match(/:(.*?);/)||[,'application/octet-stream'])[1]; const bin=atob(b); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
async function putFile(id, blob){
  const db = await openIDB();
  if(db){ return new Promise(res=>{ const tx=db.transaction('files','readwrite'); tx.objectStore('files').put(blob,id); tx.oncomplete=res; tx.onerror=res; }); }
  // 降级：存 dataURL 到 localStorage（总容量约 5MB，建议只放小文件）
  const u = await blobToDataURL(blob);
  if(!u) throw new Error('无法读取文件');
  const all = lsFiles();
  const size = JSON.stringify(all).length + u.length;
  if(size > 4.6*1024*1024) throw new Error('本地存储空间不足');
  all[id]=u; localStorage.setItem(LS_FILES, JSON.stringify(all));
}
async function getFile(id){
  const db = await openIDB();
  if(db){ const b = await new Promise(res=>{ const rq=db.transaction('files').objectStore('files').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); }); if(b) return b; }
  const all = lsFiles(); return all[id]? dataURLToBlob(all[id]) : null;
}
async function delFile(id){
  const db = await openIDB();
  if(db){ const tx=db.transaction('files','readwrite'); tx.objectStore('files').delete(id); }
  const all = lsFiles(); if(all[id]){ delete all[id]; localStorage.setItem(LS_FILES, JSON.stringify(all)); }
}

/* ================= 视图状态 ================= */
let module = 'apply';           // 'apply' | 'bank' | 'studio'
let view = 'table';
let sortKey = 'applyDate', sortAsc = false;
let keyword = '';
let editingId = null;
let editingExpId = null;
let pendingFiles = []; // 新增/编辑时待保存的附件

const main = document.getElementById('main');
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab'); if(!btn) return;
  view = btn.dataset.view;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===btn));
  render();
});
document.getElementById('modnav').addEventListener('click', e=>{
  const btn = e.target.closest('.mod'); if(!btn) return;
  module = btn.dataset.mod;
  document.querySelectorAll('.mod').forEach(t=>t.classList.toggle('active', t===btn));
  keyword = ''; document.getElementById('search').value = '';
  render();
});
document.getElementById('search').addEventListener('input', e=>{ keyword = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('btnAdd').onclick = ()=> openModal(null);

/* 顶栏随模块切换 */
function renderTopbar(){
  const applyOn = module==='apply';
  document.querySelectorAll('.apply-only').forEach(el=>el.style.display = applyOn?'':'none');
  document.querySelectorAll('.bank-only').forEach(el=>el.style.display = module==='bank'?'':'none');

  se.style.display = (module==='studio'||module==='tuner') ? 'none' : '';
  se.placeholder = module==='bank' ? '搜索经历 / 标签 / 描述…' : '搜索公司 / 岗位 / 备注…';

  }else if(module==='bank'){
    chip.textContent = `经历 ${experiences.length} 条 · ${profile.name?('档案：'+profile.name):'档案未填写'}`;
  }else if(module==='tuner'||module==='tpl'){

  }else{
    const vc = records.reduce((n,r)=>n+((r.tailored||[]).length),0);
    chip.textContent = `已保存定制版本 ${vc} 个`;
  }
}

function filtered(){
  let list = records;
  if(keyword){
    list = list.filter(r=>[r.company,r.role,r.note,r.industry,r.type,r.jd,r.next,r.history]
      .some(v=>(v||'').toString().toLowerCase().includes(keyword)));
  }
  const dir = sortAsc?1:-1;
  return [...list].sort((a,b)=>{
    let va=a[sortKey]||'', vb=b[sortKey]||'';
    return va<vb?-dir:va>vb?dir:0;
  });
}

/* ================= 总表 ================= */
const COLS = [
  {k:'company',t:'公司'},{k:'industry',t:'行业'},{k:'type',t:'类型'},{k:'role',t:'投递岗位'},
  {k:'progress',t:'当前进度'},{k:'next',t:'最近任务'},{k:'deadline',t:'截止日期'},
  {k:'applyDate',t:'投递日期'},{k:'jdUrl',t:'JD🔗'},{k:'applyUrl',t:'投递🔗'},
  {k:'companyUrl',t:'官网'},{k:'resumes',t:'简历'},{k:'tailored',t:'定制简历'},{k:'note',t:'备注'},{k:'history',t:'历史进度'}
];
function renderTable(){
  const list = filtered();
  if(!records.length){
    main.innerHTML = `<div class="empty"><div class="big">📮</div>还没有投递记录，点击右上角「新增投递」开始吧<br><br>
      <button class="btn btn-ghost" onclick="loadDemo()">载入示例数据看看效果</button></div>`;
    return;
  }
  const head = COLS.map(c=>`<th data-k="${c.k}">${c.t}${sortKey===c.k?(sortAsc?' ↑':' ↓'):''}</th>`).join('');
  const rows = list.map(r=>{
    const pc = PROGRESS_COLOR[r.progress]||'#9aa3b2';
    const dl = daysLeft(r.deadline);
    const dlTxt = dl==null?'':(dl<0?`<span style="color:var(--red)">已截止</span>`:dl<=3?`<span style="color:var(--red)">${dl}天后截止</span>`:dl<=7?`<span style="color:var(--orange)">${dl}天</span>`:`${dl}天`);
    const res = (r.resumes||[]).map(a=>`<span class="attach-item" data-dl="${a.id}" title="点击下载">${esc(a.name)}</span>`).join(' ');
    return `<tr class="data-row" data-id="${r.id}">
      <td><div class="cell-company">${esc(r.company)||'—'}</div>${r.priority==='高'?'<div class="cell-sub">🔥 高优先级</div>':''}</td>
      <td>${r.industry?`<span class="tag" style="background:#eef4ff;color:#3370ff">${esc(r.industry)}</span>`:'—'}</td>
      <td>${r.type?`<span class="tag" style="background:#f3f0ff;color:#7c5cff">${esc(r.type)}</span>`:'—'}</td>
      <td>${esc(r.role)||'—'}</td>
      <td><span class="pill" style="background:${pc}18;color:${pc}"><span class="dot" style="background:${pc}"></span>${esc(r.progress||'待投递')}</span></td>
      <td>${esc(r.next)||'—'}</td>
      <td>${fmtDate(r.deadline)}<div class="cell-sub">${dlTxt}</div></td>
      <td>${fmtDate(r.applyDate)}</td>
      <td>${r.jdUrl?`<a class="td-link" href="${esc(r.jdUrl)}" target="_blank" onclick="event.stopPropagation()">JD链接 ↗</a>`:'—'}</td>
      <td>${r.applyUrl?`<a class="td-link" href="${esc(r.applyUrl)}" target="_blank" onclick="event.stopPropagation()">投递入口 ↗</a>`:'—'}</td>
      <td>${r.companyUrl?`<a class="td-link" href="${esc(r.companyUrl)}" target="_blank" onclick="event.stopPropagation()">官网 ↗</a>`:'—'}</td>
      <td>${res||'—'}</td>
      <td>${(r.tailored||[]).length?`<a href="javascript:;" class="td-link" data-studio="${r.id}" onclick="event.stopPropagation()">🎯 ${r.tailored.length} 个定制版</a>`:`<a href="javascript:;" class="td-link" data-studio="${r.id}" onclick="event.stopPropagation()" style="color:#9aa3b2">去定制 →</a>`}</td>
      <td class="td-note" title="${esc(r.note)}">${esc(r.note)||'—'}</td>
      <td class="td-note" title="${esc(r.history)}">${esc(r.history)||'—'}</td>
    </tr>`;
  }).join('');
  main.innerHTML = `<div class="table-box"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  main.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    if(sortKey===th.dataset.k) sortAsc=!sortAsc; else {sortKey=th.dataset.k; sortAsc=true;}
    render();
  });
  main.querySelectorAll('.data-row').forEach(tr=>tr.onclick=()=>openModal(tr.dataset.id));
  main.querySelectorAll('[data-studio]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    S.targetId = el.dataset.studio;
    const rec = records.find(r=>r.id===S.targetId);
    if(rec){ S.jd = rec.jd||''; autoPick(); }
    saveStudio();
    module='studio';
    document.querySelectorAll('.mod').forEach(t=>t.classList.toggle('active', t.dataset.mod==='studio'));
    render();
  });
  main.querySelectorAll('[data-dl]').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const blob = await getFile(el.dataset.dl);
    if(!blob) return toast('附件不存在（可能来自导入的备份）');
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=el.textContent; a.click();
  });
}

/* ================= 看板 ================= */
function renderKanban(groupKey, groups, colorFn){
  const list = filtered();
  const cols = groups.map(g=>{
    const items = list.filter(r=>(r[groupKey]||'—未选择—')===g || (groupKey==='progress'&&!r[groupKey]&&g==='待投递'));
    const color = colorFn?colorFn(g):'#9aa3b2';
    const cards = items.map(r=>`
      <div class="kcard" draggable="true" data-id="${r.id}">
        <div class="kc-company">${esc(r.company)||'（未命名）'}</div>
        <div class="kc-role">${esc(r.role)||''}</div>
        <div class="kc-meta">
          ${groupKey!=='progress'&&r.progress?`<span class="tag" style="background:${PROGRESS_COLOR[r.progress]}18;color:${PROGRESS_COLOR[r.progress]}">${esc(r.progress)}</span>`:''}
          ${groupKey!=='type'&&r.type?`<span class="tag" style="background:#f3f0ff;color:#7c5cff">${esc(r.type)}</span>`:''}
          ${groupKey!=='industry'&&r.industry?`<span class="tag" style="background:#eef4ff;color:#3370ff">${esc(r.industry)}</span>`:''}
          ${groupKey!=='priority'?`<span class="tag" style="background:${PRIORITY_COLOR[r.priority]||'#9aa3b2'}18;color:${PRIORITY_COLOR[r.priority]||'#9aa3b2'}">${r.priority||'中'}优先</span>`:''}
        </div>
        ${r.next?`<div class="kc-foot" style="margin-bottom:4px">📌 ${esc(r.next)}</div>`:''}
        <div class="kc-foot"><span>${r.applyDate?'投递 '+fmtDate(r.applyDate):''}</span><span>${r.deadline?dlTag(r.deadline):''}</span></div>
      </div>`).join('');
    return `<div class="kcol" data-g="${esc(g)}">
      <div class="kcol-head"><span class="dot" style="background:${color}"></span>${esc(g)}<span class="count">${items.length}</span></div>
      <div class="kcol-body">${cards||'<div style="text-align:center;color:#b3bac4;font-size:12px;padding:14px 0">拖拽卡片到这里</div>'}</div>
    </div>`;
  }).join('');
  main.innerHTML = `<div class="kanban">${cols}</div>`;
  bindKanban(groupKey);
}
function dlTag(d){ const dl=daysLeft(d); if(dl==null) return ''; if(dl<0) return `<span style="color:var(--red)">已截止</span>`; return dl<=7?`<span style="color:${dl<=3?'var(--red)':'var(--orange)'}">${dl}天</span>`:`${dl}天`; }

function bindKanban(groupKey){
  let dragId=null;
  main.querySelectorAll('.kcard').forEach(c=>{
    c.ondragstart=()=>{dragId=c.dataset.id;c.classList.add('dragging')};
    c.ondragend=()=>c.classList.remove('dragging');
    c.onclick=()=>openModal(c.dataset.id);
  });
  main.querySelectorAll('.kcol').forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add('drag-over')};
    col.ondragleave=()=>col.classList.remove('drag-over');
    col.ondrop=e=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const rec = records.find(r=>r.id===dragId); if(!rec) return;
      const g = col.dataset.g;
      rec[groupKey] = (g==='—未选择—')?'':g;
      if(groupKey==='progress' && rec.progress==='Offer' && !rec.offerDate) rec.offerDate = new Date().toISOString().slice(0,10);
      save(); render(); toast(`已更新「${rec.company}」`);
    };
  });
}

/* ================= 甘特 ================= */
function renderGantt(){
  const list = filtered().filter(r=>r.applyDate||r.deadline);
  if(!list.length){ main.innerHTML='<div class="empty"><div class="big">📅</div>填写「投递日期」和「截止日期」后，这里会自动生成时间线</div>'; return; }
  let min='9999-99-99', max='0000-00-00';
  list.forEach(r=>{ if(r.applyDate&&r.applyDate<min)min=r.applyDate; if(r.deadline&&r.deadline>max)max=r.deadline;
    if(r.deadline&&r.deadline<min)min=r.deadline; if(r.applyDate&&r.applyDate>max)max=r.applyDate; });
  const t0 = new Date(min+'T00:00:00'); t0.setDate(1);
  const t1 = new Date(max+'T00:00:00'); t1.setMonth(t1.getMonth()+1);
  const total = (t1-t0)/86400000;
  const pos = d => d? ((new Date(d+'T00:00:00')-t0)/86400000)/total*100 : null;
  // 月份刻度
  let months=[];
  const c = new Date(t0);
  while(c<t1){ months.push({name:`${c.getFullYear()}/${c.getMonth()+1}`, start:(c-t0)/86400000/total*100}); c.setMonth(c.getMonth()+1); }
  const todayPos = pos(new Date().toISOString().slice(0,10));
  const rows = list.map(r=>{
    const x1=pos(r.applyDate), x2=pos(r.deadline);
    let left = x1??0, width = (x2??x1??0)-(x1??0); if(width<1.2) width=1.2;
    const pc = PROGRESS_COLOR[r.progress]||'#9aa3b2';
    return `<div class="g-row">
      ${months.map(m=>`<div class="g-grid" style="left:${m.start}%"></div>`).join('')}
      <div class="g-bar" data-id="${r.id}" style="left:${left}%;width:${width}%;background:${pc}" title="${esc(r.company)}｜${esc(r.progress||'')}｜投递${fmtDate(r.applyDate)} → 截止${fmtDate(r.deadline)}">${esc(r.progress||'')}</div>
    </div>`;
  }).join('');

function download(name, text, mime){
  const isJson = /json/i.test(name);
  const b = new Blob([(isJson?'':'\uFEFF')+text], {type:(mime||'text/plain')+';charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
}
function copyText(t, msg){
  const done = ()=>toast(msg||'已复制到剪贴板');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(done).catch(()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('复制失败，请手动选择文本'); } ta.remove(); }
}

function period(e){ const s=(e.start||'').replace('-','.'), t=(e.end||'').replace('-','.'); if(!s&&!t) return ''; return s+(t?(' ~ '+t):' ~ 至今'); }

function parsePackBlocks(raw, skipKeys){
  const blocks = raw.split(/\n\s*-{3,}\s*\n/).map(b=>b.trim()).filter(Boolean);
  let n = 0;
  blocks.forEach(block=>{
    const lines = block.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length) return;
    const e = {id:uid(), kind:'实习', star:3, bullets:[], tags:'', result:'', note:'', updated:new Date().toISOString().slice(0,10)};
    lines.forEach((ln,i)=>{
      if(/^@/.test(ln)){
        const parts = ln.slice(1).split('|').map(s=>s.trim()).filter(Boolean);
        const tm = parts.find(p=>/\d{4}|\d{1,2}\s*月|至今|present/i.test(p));
        const rest = parts.filter(p=>p!==tm);
        e.org = e.org||rest[0]||'';
        if(!e.role && rest[1]) e.role = rest[1];
        if(tm){
          const m = tm.match(/(\d{4})[.\-/年]?\s*(\d{1,2})?/g);
          if(m && m[0]) e.start = m[0].replace(/[年.\/]/g,'-').replace(/-$/,'').padStart(7,'0').slice(0,7);
          if(m && m[1]) e.end = m[1].replace(/[年.\/]/g,'-').replace(/-$/,'').padStart(7,'0').slice(0,7);
        }
      } else if(/^[-•·*]/.test(ln)){
        e.bullets.push(ln.replace(/^[-•·*]\s*/,''));
      } else if(/^(标签|关键词|tags?)\s*[:：]/i.test(ln)){
        e.tags = ln.replace(/^(标签|关键词|tags?)\s*[:：]\s*/i,'');
      } else if(/^(成果|结果|业绩)\s*[:：]/.test(ln)){
        e.result = ln.replace(/^(成果|结果|业绩)\s*[:：]\s*/,'');
      } else if(/^(类型|kind)\s*[:：]/i.test(ln)){
        const v = ln.replace(/^(类型|kind)\s*[:：]\s*/i,'');
        if(EXP_KINDS.includes(v)) e.kind = v;
      } else if(i===0){
        e.title = ln;
      } else if(!e.role){
        e.role = ln;
      } else {
        e.bullets.push(ln);
      }
    });
    if(!e.title) e.title = e.org || '未命名经历';
    if(skipKeys && skipKeys.has(e.title+'|'+(e.org||''))) return; // 去重跳过
    if(skipKeys) skipKeys.add(e.title+'|'+(e.org||''));
    experiences.push(e); n++;
  });
  return n;
}

/* ============================================================
   JD 匹配引擎
============================================================ */
const STOP = new Set(['以及','相关','要求','以上','具有','优先','我们','可以','进行','负责','其他','以下','时间','能够','良好','工作','能力','熟悉','了解','掌握','经验','完成','参与','岗位','公司','团队','专业','具备','较强','一定','根据','通过','使用','各项','以上学历','实习经历','相关专业']);
/* 英文停用词：虚词 + JD 中无信息量的通用词（不作为匹配关键词） */
const EN_STOP = new Set(('a,an,and,or,but,nor,yet,so,if,then,than,else,of,in,on,at,to,for,with,from,by,as,about,after,before,between,during,through,into,over,under,above,below,up,down,out,off,again,further,once,here,there,when,where,why,how,what,which,who,whom,whose,this,that,these,those,am,is,are,was,were,be,been,being,have,has,had,having,do,does,did,doing,would,should,could,can,may,might,shall,must,will,won,it,its,he,him,his,she,her,they,them,their,theirs,we,us,our,ours,you,your,yours,i,me,my,mine,myself,yourself,itself,also,just,only,very,well,too,such,both,each,all,any,some,more,most,other,others,own,same,per,via,etc,across,among,around,within,without,upon,toward,towards,along,behind,beyond,plus,not,no,yes,' +
  /* JD 场景通用词：出现也不代表技能/场景要求 */
  'job,jobs,role,roles,position,positions,work,working,works,workplace,candidate,candidates,applicant,applicants,company,companies,hiring,recruit,recruiting,seeking,looking,opportunity,opportunities,suitable,eligible,preferred,prefer,preferably,plus,bonus,responsibility,responsibilities,requirement,requirements,qualification,qualifications,duties,duty,benefit,benefits,salary,intern,internship,internships,full-time,part-time,parttime,freelance,temporary,permanent,ability,abilities,strong,good,great,excellent,basic,solid,related,relevant,field,fields,area,areas,year,years,month,months,day,days,time,schedule,office,on-site,remote,hybrid,apply,application,applicant,etc,inc,ltd,llc,co,department,departments,report,reports,reporting,including,include,includes,included,various,new,using,use,based,like,every,currently,immediately,available,support,colleague,colleagues,paid,unpaid,credit,semester,weekly,daily,' +
  /* JD 填充动词/形容词：是句子的“修辞”，不是技能或场景词 */
  'gain,gaining,gained,current,flexible,flexibility,exposure,eager,passionate,motivated,proactive,dynamic,ambitious,enthusiastic,driven,reliable,detail-oriented,self-starter,fast-paced,ideal,perfect,plus,ensure,ensuring,help,helping,learn,learning,join,joining,provide,providing,offer,offering,looking,expect,expected,experience,experiences,background,knowledge,familiarity,proficiency,skills,skill,competency,interest,passion').split(','));
function isStopWord(w){ return EN_STOP.has(w) || STOP.has(w); }
function stemEn(w){ return (w.length>3 && /ies$/.test(w)) ? w.slice(0,-3)+'y' : (w.length>3 && /(es|s)$/.test(w) && !/ss$/.test(w)) ? w.replace(/e?s$/,'') : w; }
function tokenize(text){
  const t = (text||'').toLowerCase();
  const kw = {};
  (t.match(/[a-z][a-z0-9+.#/_-]{1,}/g)||[]).forEach(w=>{
    if(w.length<2 || EN_STOP.has(w)) return;
    if(w.length<4 && STOP.has(w)) return;
    kw[w]=(kw[w]||0)+1;
  });
  (t.replace(/[^\u4e00-\u9fa5]+/g,' ').trim().split(/\s+/)).forEach(seg=>{
    if(!seg) return;
    if(seg.length<=4){ kw[seg]=(kw[seg]||0)+0.8; }
    for(let i=0;i<seg.length-1;i++){ const b=seg.slice(i,i+2); if(!STOP.has(b)) kw[b]=(kw[b]||0)+0.6; }
  });
  return kw;
}
function scoreExp(e, kw){
  const tags = (e.tags||'').toLowerCase();
  const title = ((e.title||'')+' '+(e.role||'')).toLowerCase();
  const body = ((e.bullets||[]).join(' ')+' '+(e.result||'')+' '+(e.org||'')).toLowerCase();
  let score = (e.star||3)*1.2 + Math.min((e.bullets||[]).length,5)*0.5;
  const hits = [];
  Object.keys(kw).forEach(k=>{
    const w = kw[k]; let s = 0;
    if(tags.includes(k)) s = 3.2;
    else if(title.includes(k)) s = 2.4;
    else if(body.includes(k)) s = 1.4;
    if(s>0){ s += (k.length>=3?0.8:0) + (w>1?0.5:0); score += s*w; hits.push({k, s}); }
  });
  hits.sort((a,b)=>b.s-a.s);
  return {score, hits: hits.slice(0,12).map(h=>h.k)};
}
function computeMatch(reorder){
  const kw = tokenize(S.jd);
  const res = {};
  experiences.forEach(e=>{ res[e.id] = scoreExp(e, kw); });
  const max = Math.max(1, ...Object.values(res).map(r=>r.score));
  Object.keys(res).forEach(k=>res[k].pct = Math.round(res[k].score/max*100));
  const sorted = experiences.slice().sort((a,b)=>(res[b.id]?.score||0)-(res[a.id]?.score||0)).map(e=>e.id);
  const old = (S.order||[]).filter(id=>experiences.some(e=>e.id===id));
  if(reorder || !old.length){
    S.order = sorted;
  }else{
    // 保留用户手动拖拽的顺序，新经历按匹配度追加到末尾
    const known = new Set(old);
    S.order = old.concat(sorted.filter(id=>!known.has(id)));
  }
  S.match = res; S.kwTotal = Object.keys(kw).length;
  normalizePicked();
  return res;
}
function normalizePicked(){
  experiences.forEach(e=>{
    const p = S.picked[e.id];
    if(p && !Array.isArray(p.bullets)) p.bullets = (e.bullets||[]).slice();
  });
}
function autoPick(){
  const res = computeMatch(true);
  const ranked = S.order.map(id=>({id, pct:res[id]?.pct||0}));
  let cand = ranked.filter(x=>x.pct>=50).slice(0,6);
  if(cand.length<3) cand = ranked.slice(0, Math.min(3, ranked.length)); // 匹配都不高时，至少给出前 3 段供参考
  cand.forEach(({id})=>{
    const e = experiences.find(x=>x.id===id);
    if(!S.picked[id]) S.picked[id] = {on:true, bullets:(e?.bullets||[]).slice()};
    else { S.picked[id].on = true; if(!Array.isArray(S.picked[id].bullets)) S.picked[id].bullets=(e?.bullets||[]).slice(); }
  });
  saveStudio();
}
function selectedExps(){
  return (S.order||[]).map(id=>experiences.find(e=>e.id===id)).filter(e=>e && S.picked[e.id]?.on);
}

/* ============================================================
   简历文本 / 预览生成
============================================================ */
const SEC_ORDER = ['实习','科研','项目','竞赛','课程','校园活动','技能/证书','其他'];
function targetRec(){ return records.find(r=>r.id===S.targetId)||null; }
function headerLine(){
  return [profile.name, profile.phone, profile.email, profile.city, profile.politics].filter(Boolean).join(' ｜ ');
}
function buildResumeMd(){
  const rec = targetRec();
  const L = [];
  L.push('# '+(profile.name||'（姓名待填写）'));
  if(headerLine()) L.push(headerLine());
  const intent = rec ? ((rec.role||'')+(rec.industry?('（'+rec.industry+'）'):'')) : (profile.intention||'');
  if(intent) L.push('**求职意向**：'+intent);
  if(S.summary) L.push('','**个人总结**：'+S.summary);
  if((profile.edu||[]).length){ L.push('','## 教育背景'); (profile.edu||[]).forEach(e=>L.push('- '+e)); }
  const picked = selectedExps();
  SEC_ORDER.forEach(k=>{
    const grp = picked.filter(e=>(e.kind||'其他')===k);
    if(!grp.length) return;
    L.push('','## '+k);
    grp.forEach(e=>{
      const meta = [e.org, e.role, period(e)].filter(Boolean).join(' ｜ ');
      L.push(`**${e.title}**${meta?('　'+meta):''}`);
      ((S.picked[e.id]?.bullets)||[]).filter(b=>b&&b.trim()).forEach(b=>L.push('- '+b));
      if(e.result) L.push('- '+e.result);
    });
  });
  if(profile.skills||profile.certs){
    L.push('','## 技能与证书');
    if(profile.skills) L.push('- **技能**：'+profile.skills.split('\n').filter(Boolean).join('；'));
    if(profile.certs) L.push('- **证书**：'+profile.certs.split('\n').filter(Boolean).join('；'));
  }
  if(profile.selfEval) L.push('','## 自我评价','- '+profile.selfEval);
  return L.join('\n');
}
function buildResumeHtml(){
  const rec = targetRec();
  const H = [];
  H.push(`<h1>${esc(profile.name||'姓名待填写')}</h1>`);
  if(headerLine()) H.push(`<div class="rp-contact">${esc(headerLine())}</div>`);
  const intent = rec ? ((rec.role||'')+(rec.industry?('（'+rec.industry+'）'):'')) : (profile.intention||'');
  if(intent) H.push(`<div class="rp-contact">求职意向：${esc(intent)}</div>`);
  if((profile.edu||[]).length){
    H.push('<div class="rp-sec">教育背景</div>');
    (profile.edu||[]).forEach(e=>H.push(`<div class="rp-item">${esc(e)}</div>`));
  }
  if(S.summary) H.push(`<div class="rp-sec">个人总结</div><div class="rp-item">${esc(S.summary)}</div>`);
  const picked = selectedExps();
  SEC_ORDER.forEach(k=>{
    const grp = picked.filter(e=>(e.kind||'其他')===k);
    if(!grp.length) return;
    H.push(`<div class="rp-sec">${esc(k)}</div>`);
    grp.forEach(e=>{
      const meta = [e.org, e.role, period(e)].filter(Boolean).join(' ｜ ');
      H.push(`<div class="rp-item"><div class="rp-line"><b>${esc(e.title)}</b><span style="color:#666">${esc(meta)}</span></div>
        <ul>${((S.picked[e.id]?.bullets)||[]).filter(b=>b&&b.trim()).map(b=>`<li>${esc(b)}</li>`).join('')}${e.result?`<li>${esc(e.result)}</li>`:''}</ul></div>`);
    });
  });
  if(profile.skills||profile.certs){
    H.push('<div class="rp-sec">技能与证书</div>');
    if(profile.skills) H.push(`<div class="rp-item">技能：${esc(profile.skills.split('\n').filter(Boolean).join('；'))}</div>`);
    if(profile.certs) H.push(`<div class="rp-item">证书：${esc(profile.certs.split('\n').filter(Boolean).join('；'))}</div>`);
  }
  if(profile.selfEval) H.push(`<div class="rp-sec">自我评价</div><div class="rp-item">${esc(profile.selfEval)}</div>`);
  return H.join('');
}
function buildResumeTxt(){ return buildResumeMd().replace(/^#+\s*/gm,'').replace(/\*\*/g,''); }

window.printResume = ()=>{

function renderStudio(){
  if(!records.length){
    main.innerHTML = `<div class="empty"><div class="big">🎯</div>先去「投递追踪」新增一条投递记录（含 JD 描述），再回到这里按岗位定制简历</div>`;
    return;
  }
  if(!experiences.length){
    main.innerHTML = `<div class="empty"><div class="big">🎯</div>还没有经历底稿，先去「经历库」把你的经历搬进来</div>`;
    return;
  }
  if(!S.targetId || !targetRec()) S.targetId = records[0].id;
  if(!S.jd) S.jd = targetRec()?.jd || '';
  computeMatch();
  if(!Object.keys(S.picked).length) autoPick();

  const options = records.map(r=>`<option value="${r.id}" ${r.id===S.targetId?'selected':''}>${esc(r.company)}${r.role?(' · '+esc(r.role)):''}</option>`).join('');
  const versions = (targetRec()?.tailored)||[];

  main.innerHTML = `
  <div class="studio">
    <div class="studio-left">
      <div class="panel">
        <h4>① 选择目标岗位</h4>
        <div class="sel-row">
          <select id="studioTarget" style="flex:1;min-width:200px">${options}</select>
          <button class="btn btn-ghost mini" id="btnFillJd">从记录带入 JD</button>
          <button class="btn btn-ghost mini" id="btnAutoPick">自动勾选推荐</button>
        </div>
        <div class="field" style="margin-top:12px">
          <label>岗位 JD（可直接编辑，匹配实时更新；留空则只按重要程度排序）</label>
          <textarea id="studioJd" rows="6">${esc(S.jd)}</textarea>
        </div>
        <div class="field" style="margin-top:10px">
          <label>个人总结（针对该岗位的一句话/一段话，可留空）</label>
          <textarea id="studioSummary" rows="2" placeholder="例：3段金融研究经历，覆盖消费/制造行业，能独立完成行业数据搭建与估值模型">${esc(S.summary||'')}</textarea>
        </div>
      </div>

      <div class="panel">
        <h4>② 挑选与微调经历 <span class="hint" style="font-weight:400">（按匹配度排序，勾选进入简历，拖拽 ⠿ 调整顺序，文字可直接改写）</span></h4>
        <div id="pickList"></div>
      </div>

      <div class="panel">
        <h4>③ 写作检查</h4>
        <div id="checkList"></div>
      </div>

      ${versions.length?`<div class="panel"><h4>④ 该岗位已保存的定制版本（${versions.length}）</h4>${versions.map(v=>`
        <div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f1f3;font-size:12.5px">
          <span style="flex:1">🎯 ${esc(v.name)}<span class="hint"> · ${esc(v.created)} · 含 ${Object.values(v.picked||{}).filter(p=>p.on).length} 段经历</span></span>
          <button class="btn btn-ghost mini" data-loadv="${v.id}">载入</button>
          <button class="btn btn-ghost mini" data-copyv="${v.id}">复制</button>
          <button class="btn btn-danger-ghost mini" data-delv="${v.id}">删除</button>
        </div>`).join('')}</div>`:''}
    </div>

    <div class="studio-right">
      <div class="panel">
        <h4>简历预览</h4>
        <div class="resume-preview" id="previewBox"></div>
      </div>
      <div class="panel">
        <div class="sel-row">
          <button class="btn btn-primary mini" id="btnSaveVersion">💾 保存为定制版</button>
          <button class="btn btn-ghost mini" id="btnPrint">🖨 打印 / 存PDF</button>
          <button class="btn btn-ghost mini" id="btnCopyMd">📋 复制正文</button>
          <button class="btn btn-ghost mini" id="btnDlMd">⬇️ 下载 .md</button>
        </div>
        <div class="hint" style="margin-top:9px">提示：挑 4–6 段最相关的经历，把 JD 里的关键词自然写进描述里，比堆砌全部经历更有效。</div>
      </div>
    </div>
  </div>`;

  // 事件绑定
  F('studioTarget').onchange = e=>{
    S.targetId = e.target.value;
    const r = targetRec(); S.jd = (r&&r.jd)||'';
    S.picked = {}; S.order = [];
    saveStudio(); renderStudio(); toast('已切换目标岗位');
  };
  F('btnFillJd').onclick = ()=>{ S.jd = (targetRec()?.jd)||''; saveStudio(); renderStudio(); };
  F('btnAutoPick').onclick = ()=>{ autoPick(); saveStudio(); renderStudio(); toast('已按匹配度自动勾选（可手动调整）'); };

    saveStudio(); renderStudio(); toast('已载入该定制版本');
  });
  main.querySelectorAll('[data-copyv]').forEach(b=>b.onclick=()=>{
    const v = (targetRec()?.tailored||[]).find(x=>x.id===b.dataset.copyv); if(!v) return;
    copyText(v.md||'', '定制版正文已复制');
  });

    const rec = targetRec(); if(!rec) return;
    if(!confirm('删除这个定制版本？')) return;
    rec.tailored = (rec.tailored||[]).filter(x=>x.id!==b.dataset.delv);
    save(); renderStudio(); toast('已删除');
  });

  renderPickList(); renderPreview(); renderChecks();
}

function renderPickList(){
  const res = S.match || computeMatch();
  const list = (S.order||[]).map(id=>experiences.find(e=>e.id===id)).filter(Boolean);
  F('pickList').innerHTML = list.map(e=>{
    const on = !!S.picked[e.id]?.on;
    const pct = res[e.id]?.pct ?? 0;
    const hits = res[e.id]?.hits||[];
    const sc = pct>=70?'#1f8a4c':pct>=45?'#f59e0b':'#9aa3b2';
    const c = kindColor(e.kind);
    const bullets = (S.picked[e.id]?.bullets)||e.bullets||[];
    return `<div class="pick ${on?'on':''}" draggable="true" data-eid="${e.id}">
      <div class="drag-h" title="拖拽调整顺序">⠿</div>
      <input type="checkbox" data-chk="${e.id}" ${on?'checked':''} style="margin-top:3px">
      <div class="pick-body">
        <div class="pick-head">
          <span class="exp-kind" style="background:${c}18;color:${c}">${esc(e.kind||'')}</span>
          <b>${esc(e.title)}</b>
          <span class="pick-score" style="background:${sc}18;color:${sc}">匹配 ${pct}</span>
        </div>
        <div class="pick-meta">${[e.org,e.role,period(e)].filter(Boolean).map(esc).join(' · ')}</div>
        ${hits.length?`<div class="chips">${hits.slice(0,8).map(h=>`<span class="chip hit">${esc(h)}</span>`).join('')}</div>`
          :S.jd?`<div class="chips"><span class="chip">与 JD 关键词重合较少</span></div>`:''}
        ${on?`<div style="margin-top:7px">${bullets.map((b,i)=>`<textarea class="bul-edit" rows="1" data-bul="${e.id}|${i}">${esc(b)}</textarea>`).join('')}
          <div style="font-size:11.5px;color:var(--text2);margin-top:4px">以上描述只影响这份简历，不会改动经历库原文</div></div>`
        :`<div class="exp-bul">${bullets.slice(0,3).map(esc).join('；')}</div>`}
      </div>
    </div>`;
  }).join('') || '<div class="hint">没有可用的经历，请先到「经历库」添加</div>';

  F('pickList').querySelectorAll('[data-chk]').forEach(cb=>cb.onchange=()=>{
    const id = cb.dataset.chk;
    const e = experiences.find(x=>x.id===id);
    if(cb.checked){
      if(!S.picked[id]) S.picked[id] = {on:true, bullets:(e?.bullets||[]).slice()};
      else S.picked[id].on = true;
    }else if(S.picked[id]) S.picked[id].on = false;
    saveStudio(); renderPickList(); renderPreview(); renderChecks();
  });
  let bulTimer = null;
  F('pickList').querySelectorAll('[data-bul]').forEach(ta=>{
    ta.style.height = Math.max(24, ta.scrollHeight)+'px';
    ta.oninput = ()=>{
      const [id,i] = ta.dataset.bul.split('|');
      S.picked[id].bullets[+i] = ta.value; S.picked[id].edited = true;
      clearTimeout(bulTimer);
      bulTimer = setTimeout(()=>{ saveStudio(); renderPreview(); renderChecks(); }, 350);
    };
  });
  // 拖拽排序
  let dragId = null;
  F('pickList').querySelectorAll('.pick').forEach((el,idx)=>{
    el.ondragstart = ()=>{ dragId = el.dataset.eid; el.style.opacity=.4; };
    el.ondragend = ()=>{ el.style.opacity=1; };
    el.ondragover = ev=>ev.preventDefault();

function renderChecks(){
  const picked = selectedExps();
  const items = [];
  const VERBS = /^(参与|主导|负责|独立|协助|牵头|搭建|设计|统筹|推动|完成|撰写|整理|维护|开发|研究|分析|管理|组织|策划|优化|实现|支持|配合|建立|制定|跟踪|落地|带领|输出|编制)/;
  picked.forEach(e=>{
    const bs = ((S.picked[e.id]?.bullets)||[]).filter(b=>b&&b.trim());
    if(!bs.length) items.push({lv:'warn', t:`「${e.title}」没有描述，建议至少写 2 条`});
    bs.forEach(b=>{
      if(!/\d/.test(b)) items.push({lv:'warn', t:`「${e.title}」这条缺量化数据：${b.slice(0,26)}…`});
      if(!VERBS.test(b.trim())) items.push({lv:'warn', t:`「${e.title}」这条不是动词开头，建议改成「主导/参与/搭建…」：${b.slice(0,22)}…`});
      if(b.length>72) items.push({lv:'warn', t:`「${e.title}」这条偏长（${b.length}字），建议压缩到一句话`});
    });
    if(!e.result && !bs.some(b=>/\d/.test(b))) items.push({lv:'warn', t:`「${e.title}」整体没有量化成果，补一个数字会明显加分`});
  });
  if(picked.length>6) items.push({lv:'warn', t:`已选 ${picked.length} 段经历，简历一般控制在 4–6 段更聚焦`});
  if(picked.length && picked.length<2) items.push({lv:'warn', t:'只选了 1 段经历，建议再补 1–2 段'});
  // 关键词覆盖
  if(S.jd){
    const res = S.match||computeMatch();
    const kw = tokenize(S.jd);
    const kws = Object.keys(kw);
    const covered = kws.filter(k=>picked.some(e=>{
      const txt = ((e.tags||'')+' '+e.title+' '+(e.bullets||[]).join(' ')+' '+(e.result||'')).toLowerCase();
      return txt.includes(k);
    }));
    const rate = kws.length? Math.round(covered.length/kws.length*100):0;
    if(rate<32){
      items.push({lv:'warn', t:`选中经历与 JD 关键词重合度 ${rate}%，偏低。建议在描述里补上 JD 中的能力词（如 ${kws.slice(0,6).join('、')}）`});
    }else{
      items.push({lv:'ok', t:`与 JD 关键词重合度 ${rate}%，覆盖良好`});
    }
  }
  if(!picked.length) items.push({lv:'warn', t:'还没有勾选经历'});
  if(!items.filter(i=>i.lv==='warn').length) items.push({lv:'ok', t:'看起来不错，可以保存/导出投递了'});
  F('checkList').innerHTML = items.map(i=>`<div class="check-item ${i.lv==='ok'?'ok':''}">${i.lv==='ok'?'✅ ':'⚠️ '}${esc(i.t)}</div>`).join('');
}

/* 带掩码的词频统计：长词优先，避免「数据分析」把「数据」重复计数 */
function countTerm(t, w, mask){
  let n = 0, idx = 0;
  while((idx = t.indexOf(w, idx)) >= 0){
    let covered = false;
    for(let i = idx; i < idx + w.length; i++) if(mask[i]){ covered = true; break; }
    if(!covered){ n++; for(let i = idx; i < idx + w.length; i++) mask[i] = 1; }
    idx += w.length;
  }
  return n;
}
/* 关键词提取：中文整词匹配 + 英文短语（相邻词）+ 英文单词 */
function extractTerms(text){
  const t = (text||'').toLowerCase();
  const cn = {}, mask = new Array(t.length).fill(0);
  CN_LEX.slice().sort((a,b)=>b.length-a.length).forEach(w=>{
    const n = countTerm(t, w, mask);
    if(n>0) cn[w] = n;
  });
  const words = {}, phrases = {};
  (t.match(/[a-z][a-z0-9+.#/_-]{1,}/g)||[]).forEach(w=>{ if(w.length>1 && !EN_STOP.has(w)) words[w]=(words[w]||0)+1; });
  /* 短语只从「紧邻」的词对中产生：换行、标点、停用词（and/or/in…）都是断点 */
  t.split(/[^a-z0-9+#./ \t-]+/).forEach(seg=>{
    const ws = (seg.match(/[a-z][a-z0-9+.#/-]*/g)||[]).map(x=>x.replace(/^[-.]+|[-.]+$/g,''));
    for(let i=0;i<ws.length-1;i++){
      const a = ws[i], b = ws[i+1];
      if(a.length<2 || b.length<2 || EN_STOP.has(a) || EN_STOP.has(b)) continue;
      const p = a+' '+b;
      phrases[p]=(phrases[p]||0)+1;
    }
  });
  /* 已被短语覆盖的单词不再单列（如 data analysis 吃掉 data/analysis 的唯一出现） */
  Object.keys(phrases).forEach(p=>p.split(' ').forEach(w=>{
    if(words[w] && words[w] <= phrases[p]) delete words[w];
  }));
  const all = Object.assign({}, cn);
  Object.keys(phrases).forEach(p=>all[p]=phrases[p]);
  Object.keys(words).forEach(w=>{ if(!all[w]||all[w]<words[w]) all[w]=words[w]; });
  return {cn, phrases, words, all};
}

/* JD 画像：方向判断 + 能力维度对照 */
function jdProfile(resumeLow){
  const jdLow = (T.jd||'').toLowerCase();
  const cnt = w=>{ const m = new Array(jdLow.length).fill(0); return countTerm(jdLow, w, m); };
  const dirs = JD_DIRS.map(d=>{
    const kwSorted = d.kw.slice().sort((a,b)=>b.length-a.length);
    const m = new Array(jdLow.length).fill(0);
    let n = 0; const hits = [];
    kwSorted.forEach(w=>{ const c = countTerm(jdLow, w, m); if(c>0){ n+=c; hits.push(w); } });
    return {name:d.name, n, hits};
  }).filter(d=>d.n>0).sort((a,b)=>b.n-a.n).slice(0,3);
  const max = dirs.length ? dirs[0].n : 1;
  dirs.forEach(d=>{ d.lvl = d.n/max>=0.6 ? '强' : (d.n/max>=0.3 ? '中' : '弱'); });
  const caps = CAPS.map(c=>{
    const hitKw = c.kw.slice().sort((a,b)=>b.length-a.length);
    const m = new Array(jdLow.length).fill(0);
    const present = hitKw.filter(w=>countTerm(jdLow, w, m)>0);
    if(!present.length) return null;
    const jdN = present.reduce((s,w)=>s+cnt(w),0);
    const covered = present.filter(w=>{
      if(resumeLow.includes(w)) return true;
      if(/[a-z]s$/.test(w) && resumeLow.includes(w.slice(0,-1))) return true;
      const st = stemEn(w); return st!==w && resumeLow.includes(st);
    });
    const missKw = present.filter(w=>!covered.includes(w));
    const status = covered.length===present.length ? 'full' : (covered.length ? 'partial' : 'gap');
    let exps = [];
    if(status!=='full'){
      exps = experiences.map(e=>{
        const txt = ((e.tags||'')+' '+e.title+' '+(e.role||'')+' '+(e.bullets||[]).join(' ')+' '+(e.result||'')).toLowerCase();
        return {e, s: present.filter(w=>txt.includes(w)).length};
      }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2).map(x=>x.e.title);
    }
    return {name:c.name, jdN, present, missKw, status, exps};
  }).filter(Boolean).sort((a,b)=>b.jdN-a.jdN);
  return {dirs, caps};
}
function analyzeTuner(){
  const low = (T.resume||'').toLowerCase();
  const terms = extractTerms(T.jd);
  const kws = Object.keys(terms.all).filter(k=>k.length>=2 && !/^\d+$/.test(k))
    .sort((a,b)=>terms.all[b]-terms.all[a]).slice(0,45);
  const hitTerm = k => low.includes(k) || (/[a-z]s$/.test(k) && low.includes(k.slice(0,-1))) || low.includes(stemEn(k));
  const matched = [], missing = [];
  kws.forEach(k=>{ (hitTerm(k)?matched:missing).push(k); });
  const rate = kws.length ? Math.round(matched.length/kws.length*100) : null;
  const profile = jdProfile(low);

  /* 逐条诊断：有 bullet 结构时只看 bullet 行，避免标题/联系方式噪音 */
  const lines = (T.resume||'').split(/\n/).map(s=>s.trim()).filter(Boolean);
  const isBullet = ln => /^[•\-\*·▪‣–]\s+/.test(ln) || /^\d+[.、)]\s+/.test(ln);
  const bulletCount = lines.filter(isBullet).length;
  const useLines = bulletCount>=2 ? lines.filter(isBullet)
    : lines.filter(ln=>!((/(19|20)\d{2}\s*[-–—/.]|\/(19|20)\d{2}/.test(ln) && ln.length<95)));
  const diag = [];
  useLines.forEach(ln=>{
    if(ln.length<10 || TUNER_HEADER.test(ln)) return;
    if(/@/.test(ln) || /\+?\d[\d\s-]{7,}\d/.test(ln)) return; // 联系方式行
    const issues = [];
    if(!/\d/.test(ln)) issues.push('没有数字量化 —— 补一个规模 / 比例 / 时长会更有说服力');
    if(TUNER_WEAK_CN.test(ln)) issues.push('开头偏弱（协助/参与），建议换成具体动作词：主导 / 搭建 / 审核 / 产出…');
    if(TUNER_WEAK_EN.test(ln)) issues.push('弱开头，建议换成强动词：Led / Built / Analyzed / Delivered…');
    if(ln.length>170) issues.push(`偏长（${ln.length} 字符），建议压缩到 1–2 行`);
    if(kws.length){
      const lowLn = ln.toLowerCase();
      const hits = kws.filter(k=>lowLn.includes(k));
      if(!hits.length && ln.length>60) issues.push('未命中任何 JD 关键词 —— 考虑把 JD 里的能力词自然写进去，或删减此条');
    }
    diag.push({ln, issues});
  });
  const wordCount = {};
  (low.match(/[a-z]{4,}/g)||[]).forEach(w=>{ if(!TUNER_STOP_REP.has(w)) wordCount[w]=(wordCount[w]||0)+1; });
  const repeated = Object.keys(wordCount).filter(w=>wordCount[w]>=4).slice(0,8);
  return {kws, matched, missing, rate, diag, repeated, profile, terms};
}

function renderTunerAnalysis(){
  const a = analyzeTuner();
  const cov = F('tunerCoverage');
  if(!T.jd && !T.resume){
    cov.innerHTML = '<div class="hint">左侧粘贴 JD 和简历全文后，这里会给出：JD 方向判断 → 能力维度对照 → 关键词缺口 → 逐条改写建议</div>';
  }else{
    const P = a.profile || {dirs:[],caps:[]};
    let html = '';
    /* 1. JD 方向判断 */
    if(P.dirs.length){
      html += '<div style="font-size:12px;font-weight:600;margin-bottom:6px">🧭 这份 JD 偏什么方向</div>';
      html += '<div class="chips" style="margin-bottom:7px">'+P.dirs.map(d=>
        `<span class="chip" style="background:#E1F5EE;color:#0F6E56">${esc(d.name)} · ${d.lvl}（${d.n} 处）</span>`).join('')+'</div>';
      const gapCaps = P.caps.filter(c=>c.status!=='full').slice(0,2);
      if(gapCaps.length){
        html += `<div class="hint" style="margin-bottom:10px">核心诉求：优先补强 <b>${esc(gapCaps.map(c=>c.name).join('、'))}</b>——这两块 JD 提及最多而简历还没跟上。已匹配的能力保持现状即可。</div>`;
      }
    }
    /* 2. 能力维度对照 */
    if(P.caps.length){
      html += '<div style="font-size:12px;font-weight:600;margin:4px 0 6px">📋 JD 能力要求 vs 你的简历</div>';
      P.caps.forEach(c=>{
        const badge = c.status==='full' ? ['f0f9f1','1f8a4c','✅ 匹配']
          : c.status==='partial' ? ['fff8e6','b8860b','⚠️ 部分匹配'] : ['fdecec','c0392b','❌ 缺口'];
        let detail;
        if(c.status==='full'){
          detail = '已覆盖：'+c.present.slice(0,5).map(esc).join('、');
        }else if(c.exps.length){
          detail = '可在「'+c.exps.map(esc).join('」「')+'」中往该方向补写'+(c.missKw.length?('（缺：'+c.missKw.slice(0,4).map(esc).join('、')+'）'):'');
        }else{
          detail = '经历库暂无直接素材，建议写入个人总结/求职信，并准备面试话术'+(c.missKw.length?('（缺：'+c.missKw.slice(0,4).map(esc).join('、')+'）'):'');
        }
        html += `<div style="border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(c.name)}</b>
          <span style="color:#${badge[1]};white-space:nowrap">${badge[2]} · JD 提及 ${c.jdN} 次</span></div>
          <div style="color:var(--text2);margin-top:3px;line-height:1.6">${detail}</div></div>`;
      });
    }
    /* 3. 关键词覆盖（辅助） */
    const rateHtml = a.rate===null ? '' :
      `<div style="font-size:12px;font-weight:600;margin:12px 0 5px">🔑 关键词覆盖 <span class="hint" style="font-weight:400">（整词/词组级，加权参考）</span></div>
       <div style="font-size:22px;font-weight:700;color:${a.rate>=60?'#1f8a4c':a.rate>=35?'#f59e0b':'#c0392b'}">${a.rate}%</div>
       <div style="height:6px;background:#eef0f3;border-radius:4px;margin:6px 0 9px;overflow:hidden"><div style="height:100%;width:${a.rate}%;background:${a.rate>=60?'#1f8a4c':a.rate>=35?'#f59e0b':'#c0392b'}"></div></div>`;
    const missHtml = a.missing.length ? `
      <div style="font-size:12px;font-weight:600;margin-bottom:5px">❌ 缺失关键词（${a.missing.length}）</div>
      <div class="chips" style="margin-bottom:9px">${a.missing.slice(0,14).map(k=>`<span class="chip" style="background:#fdecec;color:#c0392b">${esc(k)}</span>`).join('')}</div>
      <div style="font-size:12px;color:var(--text2);line-height:1.8">
        ${a.missing.slice(0,5).map(k=>{
          const exs = expForKw(k);
          return `· <b>${esc(k)}</b> → ${exs.length?('可在「'+exs.map(e=>esc(e.title)).join('」「')+'」中体现'):'经历库暂无相关素材，可写进个人总结或面试话术'}`;
        }).join('<br>')}</div>`
      : (a.kws.length?'<div class="hint">🎉 JD 关键词全部覆盖</div>':'');
    const hitHtml = a.matched.length ? `
      <div style="font-size:12px;font-weight:600;margin:4px 0 5px">✅ 已覆盖（${a.matched.length}）</div>
      <div class="chips">${a.matched.slice(0,20).map(k=>`<span class="chip hit">${esc(k)}</span>`).join('')}</div>` : '';
    const repHtml = a.repeated.length ? `
      <div style="font-size:12px;font-weight:600;margin:12px 0 5px">🔁 高频重复词（注意换词）</div>
      <div class="chips">${a.repeated.map(k=>`<span class="chip" style="background:#fff4e0;color:#b8860b">${esc(k)}</span>`).join('')}</div>` : '';
    cov.innerHTML = html + rateHtml + missHtml + hitHtml + repHtml;
  }
  // 逐条诊断
  const dg = F('tunerDiag');
  if(!T.resume){ dg.innerHTML = '<div class="hint">粘贴简历全文后，每一条描述都会给出改写建议</div>'; }
  else if(!a.diag.length){ dg.innerHTML = '<div class="hint">没有发现需要诊断的描述行</div>'; }
  else{
    const nWarn = a.diag.filter(d=>d.issues.length).length;
    dg.innerHTML = `<div class="hint" style="margin-bottom:8px">共 ${a.diag.length} 条描述，${nWarn? nWarn+' 条有改进空间':'全部达标 🎉'}</div>` +
      a.diag.map(d=>{
        const color = d.issues.length?'#fdf6ec':'#f0f9f1';
        const bd = d.issues.length?'#f0e6d2':'#d9eeda';
        return `<div style="padding:8px 10px;border:1px solid ${bd};background:${color};border-radius:8px;margin-bottom:7px;font-size:12.5px">
          <div style="color:var(--text2);margin-bottom:3px">${esc(d.ln.length>76? d.ln.slice(0,76)+'…' : d.ln)}</div>
          ${d.issues.map(x=>`<div style="color:#c0392b">⚠️ ${esc(x)}</div>`).join('')}
        </div>`;
      }).join('');
  }
  // 顶栏字数
  renderTopbar();
}
